<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SM Online Shop - Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
color:#17151b
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer
}

.hidden{
display:none!important
}

/* LOGIN */

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#17151b,#f41470)
}

.loginBox{
width:100%;
max-width:420px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 20px 50px #0005
}

.loginBox h1{
margin-top:0;
text-align:center
}

.loginLogo{
width:70px;
height:70px;
margin:auto;
border-radius:50%;
background:#17151b;
color:#fff;
border:4px solid #f41470;
display:grid;
place-items:center;
font-size:22px;
font-weight:bold
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin:6px 0 12px;
outline:none
}

input:focus,
select:focus,
textarea:focus{
border-color:#f41470
}

label{
font-size:13px;
font-weight:bold
}

.btn{
border:0;
background:#f41470;
color:#fff;
padding:11px 17px;
border-radius:8px;
font-weight:bold
}

.btn:hover{
opacity:.9
}

.gray{
background:#777
}

.red{
background:#d52f46
}

.green{
background:#159447
}

/* HEADER */

header{
background:#17151b;
color:#fff;
padding:15px 5%;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

header h1{
margin:0;
font-size:21px
}

header small{
color:#ff75ae
}

/* DASHBOARD */

.wrap{
max-width:1250px;
margin:auto;
padding:20px 14px
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px
}

.stat{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 2px 10px #0000000d
}

.stat small{
color:#777
}

.stat b{
display:block;
font-size:27px;
margin-top:8px
}

/* NAV */

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:20px
}

.tab{
border:0;
background:#fff;
padding:11px 16px;
border-radius:8px;
font-weight:bold
}

.tab.active{
background:#f41470;
color:#fff
}

.panel{
background:#fff;
border-radius:15px;
padding:20px;
box-shadow:0 2px 10px #0000000d;
margin-bottom:20px
}

.panel h2{
margin-top:0
}

/* PRODUCT */

.productGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.product{
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
background:#fff
}

.product img{
width:100%;
height:210px;
object-fit:cover;
background:#eee
}

.productBody{
padding:13px
}

.productBody h3{
margin:0 0 8px
}

.price{
color:#f41470;
font-size:18px;
font-weight:bold
}

.old{
color:#999;
font-size:12px;
text-decoration:line-through;
margin-left:5px
}

.actions{
display:flex;
gap:7px;
margin-top:10px
}

.actions button{
flex:1;
border:0;
padding:9px;
border-radius:7px;
font-weight:bold
}

/* FORM */

.formGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{
grid-column:1/-1
}

.preview{
width:130px;
height:130px;
object-fit:cover;
border-radius:10px;
border:1px solid #ddd;
margin:5px 0 10px
}

/* ORDERS */

.order{
border:1px solid #eee;
border-radius:12px;
padding:15px;
margin-bottom:12px
}

.orderHead{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap
}

.status{
padding:5px 9px;
border-radius:6px;
background:#fff0f5;
color:#f41470;
font-weight:bold;
font-size:12px
}

.orderItems{
background:#fafafa;
padding:10px;
margin-top:10px;
border-radius:8px
}

/* TABLE */

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:left;
font-size:13px
}

/* MESSAGE */

.msg{
padding:10px;
border-radius:8px;
margin-bottom:12px;
display:none
}

.success{
display:block;
background:#e9fff1;
color:#08752f
}

.error{
display:block;
background:#ffecee;
color:#a50019
}

/* MOBILE */

@media(max-width:900px){

.stats{
grid-template-columns:repeat(2,1fr)
}

.productGrid{
grid-template-columns:repeat(2,1fr)
}

}

@media(max-width:600px){

header{
padding:13px
}

header h1{
font-size:17px
}

.stats{
grid-template-columns:1fr 1fr
}

.productGrid{
grid-template-columns:1fr
}

.formGrid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.panel{
padding:14px
}

.actions{
flex-direction:column
}

.tabs{
overflow:auto;
flex-wrap:nowrap
}

.tab{
white-space:nowrap
}

table{
font-size:11px
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage" class="login">

<div class="loginBox">

<div class="loginLogo">SM</div>

<h1>SM Online Shop</h1>

<p style="text-align:center;color:#777">
Admin Panel
</p>

<div id="loginMsg" class="msg"></div>

<label>Username</label>

<input
id="username"
placeholder="Admin username"
autocomplete="username"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Admin password"
autocomplete="current-password"
>

<button
class="btn"
style="width:100%"
onclick="login()">
Login
</button>

</div>

</section>


<!-- ADMIN -->

<section id="adminPage" class="hidden">

<header>

<div>

<h1>SM Online Shop</h1>

<small>Admin Dashboard</small>

</div>

<button
class="btn red"
onclick="logout()">
Logout
</button>

</header>


<div class="wrap">

<!-- STATS -->

<div class="stats">

<div class="stat">

<small>Total Products</small>

<b id="productCount">0</b>

</div>

<div class="stat">

<small>Total Orders</small>

<b id="orderCount">0</b>

</div>

<div class="stat">

<small>Pending Orders</small>

<b id="pendingCount">0</b>

</div>

<div class="stat">

<small>Total Sales</small>

<b id="salesTotal">৳0</b>

</div>

</div>


<!-- TABS -->

<div class="tabs">

<button
class="tab active"
onclick="showTab('products',this)">
🛍 Products
</button>

<button
class="tab"
onclick="showTab('add',this)">
➕ Add Product
</button>

<button
class="tab"
onclick="showTab('orders',this)">
📦 Orders
</button>

<button
class="tab"
onclick="showTab('settings',this)">
⚙️ Settings
</button>

</div>


<!-- PRODUCTS -->

<div id="productsTab" class="tabContent">

<div class="panel">

<h2>Products</h2>

<input
id="productSearch"
placeholder="Search products..."
oninput="searchProducts()"
>

<div
id="productGrid"
class="productGrid">
</div>

</div>

</div>


<!-- ADD / EDIT -->

<div
id="addTab"
class="tabContent hidden">

<div class="panel">

<h2 id="formTitle">
Add New Product
</h2>

<div id="productMsg" class="msg"></div>

<input
type="hidden"
id="editId"
>

<div class="formGrid">

<div>

<label>Product Name</label>

<input
id="pName"
placeholder="Example: Premium Ladies Dress"
>

</div>


<div>

<label>Category</label>

<select id="pCategory">

<option>Dresses</option>
<option>Tops</option>
<option>Saree</option>
<option>Hijab</option>
<option>Bags</option>
<option>Shoes</option>
<option>Jewellery</option>
<option>Accessories</option>
<option>General</option>

</select>

</div>


<div>

<label>Price</label>

<input
id="pPrice"
type="number"
step="0.01"
placeholder="1200"
>

</div>


<div>

<label>Old Price</label>

<input
id="pOldPrice"
type="number"
step="0.01"
placeholder="1500"
>

</div>


<div>

<label>Discount %</label>

<input
id="pDiscount"
type="number"
step="0.01"
placeholder="20"
>

</div>


<div>

<label>Stock</label>

<input
id="pStock"
type="number"
placeholder="10"
>

</div>


<div class="full">

<label>Product Image</label>

<input
id="pImageFile"
type="file"
accept="image/*"
onchange="previewImage(event)"
>

<img
id="imagePreview"
class="preview hidden"
>

<input
id="pImage"
placeholder="Image URL"
>

<small style="color:#777">
Choose an image to upload to Cloudinary, or paste an image URL.
</small>

</div>

</div>


<div style="display:flex;gap:10px;margin-top:10px">

<button
class="btn"
onclick="saveProduct()">
💾 Save Product
</button>

<button
class="btn gray"
onclick="resetProductForm()">
Clear
</button>

</div>

</div>

</div>


<!-- ORDERS -->

<div
id="ordersTab"
class="tabContent hidden">

<div class="panel">

<h2>📦 Customer Orders</h2>

<div id="ordersList">
Loading...
</div>

</div>

</div>


<!-- SETTINGS -->

<div
id="settingsTab"
class="tabContent hidden">

<div class="panel">

<h2>⚙️ Store Settings</h2>

<div id="settingsMsg" class="msg"></div>

<div class="formGrid">

<div>

<label>Shop Name</label>

<input id="shopName">

</div>


<div>

<label>Tagline</label>

<input id="tagline">

</div>


<div>

<label>Phone 1</label>

<input id="phone1">

</div>


<div>

<label>Phone 2</label>

<input id="phone2">

</div>


<div class="full">

<label>Facebook Page</label>

<input
id="facebook"
placeholder="https://facebook.com/..."
>

</div>


<div>

<label>Currency</label>

<select id="currency">

<option value="BDT">
BDT
</option>

<option value="USD">
USD
</option>

</select>

</div>

</div>


<button
class="btn"
onclick="saveSettings()">
💾 Save Settings
</button>

</div>

</div>

</div>

</div>


<script>

let token =
localStorage.getItem("smAdminToken") || "";

let products = [];

let orders = [];


/* =========================
   API
========================= */

async function api(
url,
options={}
){

options.headers =
options.headers || {};

if(token){

options.headers.Authorization =
"Bearer " + token;

}

if(
options.body &&
typeof options.body === "object" &&
!(options.body instanceof FormData)
){

options.headers["Content-Type"] =
"application/json";

options.body =
JSON.stringify(options.body);

}

const response =
await fetch(url,options);

let data={};

try{

data =
await response.json();

}catch(e){}

if(response.status===401){

logout();

throw new Error(
data.error ||
"Session expired"
);

}

if(!response.ok){

throw new Error(
data.error ||
"Request failed"
);

}

return data;

}


/* =========================
   LOGIN
========================= */

async function login(){

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value;

const msg =
document.getElementById("loginMsg");

msg.className="msg";
msg.textContent="";

if(!username || !password){

msg.className="msg error";

msg.textContent =
"Username and password required.";

return;

}

try{

const data =
await api(
"/api/admin/login",
{
method:"POST",
body:{
username,
password
}
}
);

token=data.token;

localStorage.setItem(
"smAdminToken",
token
);

showAdmin();

}catch(error){

msg.className="msg error";

msg.textContent =
error.message;

}

}


/* =========================
   LOGOUT
========================= */

async function logout(){

try{

if(token){

await fetch(
"/api/admin/logout",
{
method:"POST",
headers:{
Authorization:
"Bearer "+token
}
}
);

}

}catch(e){}

token="";

localStorage.removeItem(
"smAdminToken"
);

document
.getElementById("adminPage")
.classList.add("hidden");

document
.getElementById("loginPage")
.classList.remove("hidden");

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPage")
.classList.remove("hidden");

await loadProducts();

await loadOrders();

await loadSettings();

}


/* =========================
   TABS
========================= */

function showTab(
name,
button
){

document
.querySelectorAll(".tabContent")
.forEach(x=>
x.classList.add("hidden")
);

document
.getElementById(name+"Tab")
.classList.remove("hidden");

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

button.classList.add("active");

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

try{

products =
await api(
"/api/admin/products"
);

renderProducts();

updateStats();

}catch(error){

alert(error.message);

}

}


function renderProducts(
list=products
){

const grid =
document.getElementById(
"productGrid"
);

if(!list.length){

grid.innerHTML =
"<p>No products found.</p>";

return;

}

grid.innerHTML =
list.map(p=>`

<div class="product">

<img
src="${escapeHtml(p.image||"")}"
onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22500%22 height=%22500%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22>NO IMAGE</text></svg>'"
>

<div class="productBody">

<h3>
${escapeHtml(p.name)}
</h3>

<small>
${escapeHtml(p.category)}
</small>

<p class="price">

৳${Number(p.price).toLocaleString("en-BD")}

<span class="old">
৳${Number(p.oldPrice||p.price).toLocaleString("en-BD")}
</span>

</p>

<p>
Stock:
<b>${p.stock}</b>
&nbsp; | &nbsp;
Discount:
<b>${p.discount}%</b>
</p>

<div class="actions">

<button
style="background:#fff0f5;color:#f41470"
onclick="editProduct(${p.id})">
✏️ Edit
</button>

<button
style="background:#ffecee;color:#c00"
onclick="deleteProduct(${p.id})">
🗑 Delete
</button>

</div>

</div>

</div>

`).join("");

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

const q =
document
.getElementById("productSearch")
.value
.toLowerCase();

renderProducts(
products.filter(p=>
(
p.name+
" "+
p.category
)
.toLowerCase()
.includes(q)
)
);

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(event){

const file =
event.target.files[0];

if(!file)return;

const preview =
document.getElementById(
"imagePreview"
);

preview.src =
URL.createObjectURL(file);

preview.classList.remove(
"hidden"
);

}


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(){

const file =
document
.getElementById("pImageFile")
.files[0];

if(!file){

return document
.getElementById("pImage")
.value.trim();

}

if(file.size>10*1024*1024){

throw new Error(
"Image must be smaller than 10MB."
);

}

return new Promise(
(resolve,reject)=>{

const reader =
new FileReader();

reader.onload=async()=>{

try{

const data =
await api(
"/api/admin/upload",
{
method:"POST",
body:{
image:
reader.result
}
}
);

resolve(data.url);

}catch(error){

reject(error);

}

};

reader.onerror=()=>{
reject(
new Error("Could not read image")
);
};

reader.readAsDataURL(file);

}
);

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(){

const msg =
document.getElementById(
"productMsg"
);

msg.className="msg";

try{

const name =
document.getElementById("pName")
.value.trim();

const price =
Number(
document.getElementById("pPrice")
.value
);

if(!name){

throw new Error(
"Product name is required."
);

}

if(price<=0){

throw new Error(
"Valid product price is required."
);

}

msg.className="msg success";

msg.textContent =
"Saving product...";

const image =
await uploadImage();

const body={

name,

category:
document.getElementById(
"pCategory"
).value,

price,

oldPrice:
Number(
document.getElementById(
"pOldPrice"
).value
) || price,

discount:
Number(
document.getElementById(
"pDiscount"
).value
) || 0,

stock:
Number(
document.getElementById(
"pStock"
).value
) || 0,

image

};

const editId =
document.getElementById(
"editId"
).value;

if(editId){

await api(
"/api/admin/products/"+editId,
{
method:"PUT",
body
}
);

msg.textContent =
"Product updated successfully.";

}else{

await api(
"/api/admin/products",
{
method:"POST",
body
}
);

msg.textContent =
"Product added successfully.";

}

await loadProducts();

resetProductForm();

}catch(error){

msg.className="msg error";

msg.textContent =
error.message;

}

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id){

const p =
products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

document
.getElementById("editId")
.value=p.id;

document
.getElementById("pName")
.value=p.name;

document
.getElementById("pCategory")
.value=p.category;

document
.getElementById("pPrice")
.value=p.price;

document
.getElementById("pOldPrice")
.value=p.oldPrice;

document
.getElementById("pDiscount")
.value=p.discount;

document
.getElementById("pStock")
.value=p.stock;

document
.getElementById("pImage")
.value=p.image||"";

document
.getElementById("formTitle")
.textContent=
"Edit Product";

document
.getElementById("addTab")
.classList.remove("hidden");

document
.getElementById("productsTab")
.classList.add("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

const p =
products.find(
x=>Number(x.id)===Number(id)
);

if(!p)return;

if(
!confirm(
'Delete "'+
p.name+
'"?'
)
){

return;

}

try{

await api(
"/api/admin/products/"+id,
{
method:"DELETE"
}
);

await loadProducts();

alert(
"Product deleted successfully."
);

}catch(error){

alert(error.message);

}

}


/* =========================
   RESET FORM
========================= */

function resetProductForm(){

document
.getElementById("editId")
.value="";

document
.getElementById("pName")
.value="";

document
.getElementById("pPrice")
.value="";

document
.getElementById("pOldPrice")
.value="";

document
.getElementById("pDiscount")
.value="";

document
.getElementById("pStock")
.value="";

document
.getElementById("pImage")
.value="";

document
.getElementById("pImageFile")
.value="";

document
.getElementById("imagePreview")
.classList.add("hidden");

document
.getElementById("formTitle")
.textContent=
"Add New Product";

}


/* =========================
   ORDERS
========================= */

async function loadOrders(){

try{

orders =
await api(
"/api/admin/orders"
);

renderOrders();

updateStats();

}catch(error){

console.error(error);

}

}


function renderOrders(){

const box =
document.getElementById(
"ordersList"
);

if(!orders.length){

box.innerHTML =
"<p>No orders yet.</p>";

return;

}

box.innerHTML =
orders.map(order=>{

const customer =
order.customer || {};

const items =
order.items || [];

return `

<div class="order">

<div class="orderHead">

<div>

<b>
Order #${escapeHtml(order.id)}
</b>

<br>

<small>
${new Date(
order.createdAt
).toLocaleString("en-BD")}
</small>

</div>

<span class="status">
${escapeHtml(order.status)}
</span>

</div>

<hr>

<b>Customer</b>

<p>
Name:
${escapeHtml(customer.name||"")}
<br>

Phone:
${escapeHtml(customer.phone||"")}
<br>

Address:
${escapeHtml(customer.address||"")}
</p>

<b>Payment:</b>
${escapeHtml(order.paymentMethod||"cod")}

<div class="orderItems">

<b>Products</b>

${items.map(item=>`

<div>
${escapeHtml(item.name)}
× ${item.qty}
= ৳${Number(
item.price*item.qty
).toLocaleString("en-BD")}
</div>

`).join("")}

<hr>

<b>
Total:
৳${Number(
order.total
).toLocaleString("en-BD")}
</b>

</div>

</div>

`;

}).join("");

}


/* =========================
   SETTINGS
========================= */

async function loadSettings(){

try{

const data =
await api(
"/api/store"
);

const s =
data.settings || {};

document
.getElementById("shopName")
.value =
s.shopName||"";

document
.getElementById("tagline")
.value =
s.tagline||"";

document
.getElementById("phone1")
.value =
s.phone1||"";

document
.getElementById("phone2")
.value =
s.phone2||"";

document
.getElementById("facebook")
.value =
s.facebook||"";

document
.getElementById("currency")
.value =
s.currency||"BDT";

}catch(error){

console.error(error);

}

}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings(){

const msg =
document.getElementById(
"settingsMsg"
);

msg.className="msg";

try{

const data =
await api(
"/api/admin/settings",
{
method:"PUT",

/* =========================
   STATS
========================= */

function updateStats(){

document
.getElementById("productCount")
.textContent =
products.length;

document
.getElementById("orderCount")
.textContent =
orders.length;

document
.getElementById("pendingCount")
.textContent =
orders.filter(
x=>x.status==="Pending"
).length;

const sales =
orders.reduce(
(sum,x)=>
sum+Number(x.total||0),
0
);

document
.getElementById("salesTotal")
.textContent =
"৳"+
sales.toLocaleString("en-BD");

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
