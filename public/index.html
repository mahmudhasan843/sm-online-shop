<!-- index.html -->
<!-- Google + Facebook Login only | Phone/OTP removed -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>SM Online Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111827;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* ================= SHOP ================= */

    #shopApp {
      display: block;
    }

    header {
      background: #111827;
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .tagline {
      font-size: 11px;
      opacity: .75;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      border: 0;
      background: #fff;
      color: #111827;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: bold;
    }

    .cart-count {
      background: #dc2626;
      color: #fff;
      border-radius: 20px;
      padding: 2px 6px;
      font-size: 11px;
      margin-left: 3px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .hero {
      background: #111827;
      color: #fff;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .hero h2 {
      margin-bottom: 7px;
    }

    .hero p {
      opacity: .8;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 3px;
    }

    .category-btn {
      white-space: nowrap;
      border: 1px solid #ddd;
      background: #fff;
      padding: 9px 14px;
      border-radius: 20px;
    }

    .category-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    /* ================= PRODUCTS ================= */

    #productsGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .product-card {
      background: #fff;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      position: relative;
    }

    .product-image-wrap {
      position: relative;
      height: 245px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform .25s;
    }

    .product-image:hover {
      transform: scale(1.05);
    }

    .discount-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #dc2626;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .product-info {
      padding: 13px;
    }

    .product-category {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-description {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
      min-height: 36px;
      margin-bottom: 10px;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
    }

    .stock-text {
      color: #15803d;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .out-stock {
      color: #dc2626;
    }

    .add-cart-btn {
      width: 100%;
      border: 0;
      background: #111827;
      color: #fff;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
    }

    .add-cart-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* ================= MODALS ================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 3000;
      padding: 15px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 15px;
      margin: 30px auto;
      padding: 20px;
      position: relative;
    }

    .modal-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      border: 0;
      background: transparent;
      font-size: 25px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 11px;
      outline: none;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: #111827;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid #ddd;
      background: #fff;
      color: #111827;
      padding: 11px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 8px;
    }

    /* ================= CART ================= */

    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .qty-controls button {
      border: 1px solid #ddd;
      background: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .remove-btn {
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .cart-total {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      margin: 18px 0;
    }

    /* ================= ORDER ================= */

    .order-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e5e7eb;
      font-size: 11px;
      font-weight: bold;
    }

    .status-confirmed {
      background: #dcfce7;
      color: #166534;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 5px 0;
      font-size: 13px;
    }

    /* ================= IMAGE ZOOM ================= */

    #imageZoomModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,.92);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #zoomImage {
      max-width: 95%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    #closeZoom {
      position: absolute;
      top: 15px;
      right: 20px;
      color: #fff;
      font-size: 35px;
      border: 0;
      background: transparent;
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #111827;
      color: #fff;
      text-align: center;
      padding: 25px 15px;
    }

    footer a {
      color: #fff;
      text-decoration: none;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      #productsGrid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      #productsGrid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image-wrap {
        height: 190px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-description {
        font-size: 11px;
      }

      .price {
        font-size: 16px;
      }

      .header-inner {
        padding: 10px;
      }

      .brand {
        font-size: 17px;
      }

      .header-btn {
        padding: 7px 8px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {
      #productsGrid {
        grid-template-columns: 1fr 1fr;
      }

      .product-image-wrap {
        height: 160px;
      }
    }
  </style>
</head>

<body>



<!-- ================= SHOP APP ================= -->

<section id="shopApp">

  <header>

    <div class="header-inner">

      <div>
        <div class="brand" id="shopName">SM Online Shop</div>
        <div class="tagline" id="shopTagline">
          Style • Comfort • Confidence ♥
        </div>
      </div>

      <div class="header-actions">

        <button
          class="header-btn"
          onclick="openCart()">
          🛒 Cart
          <span id="cartCount" class="cart-count">0</span>
        </button>

        <button
          class="header-btn"
          onclick="openTrackOrder()">
          🔎 Track Order
        </button>

      </div>

    </div>

  </header>


  <main>

    <section class="hero">

      <h2>Welcome to SM Online Shop</h2>

      <p>
        Find your favourite products at the best price.
      </p>

    </section>


    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Search products..."
        oninput="renderProducts()">

    </div>


    <div
      id="categoryBar"
      class="category-bar">
    </div>


    <div id="productsGrid"></div>

  </main>


  <footer>

    <p id="footerShopName">SM Online Shop</p>

    <p style="margin-top:6px;">
      📞 <span id="footerPhone1">01827872334</span>
      |
      <span id="footerPhone2">01886995687</span>
    </p>

    <p style="margin-top:8px;">
      <a
        href="https://www.facebook.com/share/1Dr8FEmuoQ/"
        target="_blank">
        Facebook Page
      </a>
    </p>

  </footer>

</section>





<!-- ================= CART MODAL ================= -->

<div id="cartModal" class="modal">

  <div class="modal-box">

    <button
      class="close-btn"
      onclick="closeModal('cartModal')">
      ×
    </button>

    <div class="modal-title">
      🛒 My Cart
    </div>

    <div id="cartItems"></div>

    <div
      id="cartTotal"
      class="cart-total">
      Total: ৳0
    </div>

    <button
      id="checkoutBtn"
      class="primary-btn"
      onclick="openCheckout()">
      Checkout
    </button>

  </div>

</div>


<!-- ================= CHECKOUT MODAL ================= -->

<div id="checkoutModal" class="modal">

  <div class="modal-box">

    <button
      class="close-btn"
      onclick="closeModal('checkoutModal')">
      ×
    </button>

    <div class="modal-title">
      Checkout
    </div>

    <p style="font-size:12px;color:#777;margin-bottom:15px;">No account/login required. Enter your delivery details below.</p>

    <div class="form-group">

      <label>Name</label>

      <input
        id="checkoutName"
        type="text">

    </div>


    <div class="form-group">

      <label>Phone</label>

      <input
        id="checkoutPhone"
        type="tel"
        placeholder="01XXXXXXXXX">

    </div>


    <div class="form-group">

      <label>Delivery Address</label>

      <textarea
        id="checkoutAddress"
        placeholder="Full delivery address"></textarea>

    </div>


    <div class="form-group">

      <label>Payment Method</label>

      <select id="paymentMethod">

        <option value="Cash on Delivery">
          Cash on Delivery
        </option>

        <option value="bKash">
          bKash
        </option>

        <option value="Nagad">
          Nagad
        </option>

        <option value="Card">
          Card
        </option>

      </select>

    </div>


    <button
      class="primary-btn"
      onclick="placeOrder()">
      Place Order
    </button>

  </div>

</div>





<!-- ================= TRACK MODAL ================= -->

<div id="trackModal" class="modal">

  <div class="modal-box">

    <button
      class="close-btn"
      onclick="closeModal('trackModal')">
      ×
    </button>

    <div class="modal-title">
      🔎 Track Order
    </div>

    <div class="form-group">

      <label>Order ID</label>

      <input
        id="trackOrderId"
        type="text"
        placeholder="Enter order ID">

    </div>

    <button
      class="primary-btn"
      onclick="trackOrder()">
      Track
    </button>

    <div
      id="trackResult"
      style="margin-top:15px;">
    </div>

  </div>

</div>


<!-- ================= IMAGE ZOOM ================= -->

<div id="imageZoomModal">

  <button id="closeZoom" onclick="closeZoom()">
    ×
  </button>

  <img
    id="zoomImage"
    src=""
    alt="Product">

</div>


<script>

/* =========================================================
   GLOBAL DATA
========================================================= */

let products = [];
let settings = {};
let selectedCategory = "All";


let cart = [];

try {
  cart = JSON.parse(localStorage.getItem("smCart") || "[]");
  if (!Array.isArray(cart)) cart = [];
} catch {
  cart = [];
}


/* =========================================================
   BASIC HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function money(value) {

  const n = Number(value || 0);

  return "৳" + n.toLocaleString("en-BD", {
    maximumFractionDigits: 2
  });

}


function saveCart() {

  localStorage.setItem(
    "smCart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function closeModal(id) {

  const el = document.getElementById(id);

  if (el) {
    el.style.display = "none";
  }

}


function openModal(id) {

  const el = document.getElementById(id);

  if (el) {
    el.style.display = "block";
  }

}


/* =========================================================
   GUEST SHOP MODE
   Customer login is intentionally disabled.
========================================================= */

function showShop() {
  const shop = document.getElementById("shopApp");
  if (shop) shop.style.display = "block";
}


/* =========================================================
   STORE LOAD
========================================================= */

async function loadStore() {

  try {

    const response = await fetch(
      "/api/store",
      {
        credentials: "include",
        cache: "no-store"
      }
    );

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Failed to place order."
      );

    }


    cart = [];

    saveCart();

    closeModal("checkoutModal");

    alert(
      "Order placed successfully!\n\nOrder ID: " +
      data.orderId
    );

    renderProducts();

    document.getElementById("trackOrderId").value = String(data.orderId || "");
    openTrackOrder();
    trackOrder();

  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "Failed to place order."
    );

  }

}


/* =========================================================
   ACCOUNT
========================================================= */

/* =========================================================
   TRACK ORDER
========================================================= */

function openTrackOrder() {

  closeModal("accountModal");

  document.getElementById(
    "trackOrderId"
  ).value = "";

  document.getElementById(
    "trackResult"
  ).innerHTML = "";

  openModal("trackModal");

}


async function trackOrder() {

  const id =
    document.getElementById(
      "trackOrderId"
    ).value.trim();


  if (!id) {

    alert("Enter order ID.");

    return;

  }


  const result =
    document.getElementById(
      "trackResult"
    );


  result.innerHTML = `
    <div class="empty">
      Loading...
    </div>
  `;


  try {

    const response =
      await fetch(
        "/api/orders/" +
        encodeURIComponent(id),
        {
          credentials: "include",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Order not found."
      );

    }


    const order =
      data.order || data;


    result.innerHTML = `

      <div class="order-card">

        <div class="order-row">
          <strong>Order ID</strong>
          <span>
            ${escapeHtml(order.id)}
          </span>
        </div>

        <div class="order-row">
          <strong>Status</strong>
          <span class="status">
            ${escapeHtml(order.status)}
          </span>
        </div>

        <div class="order-row">
          <strong>Total</strong>
          <span>
            ${money(order.total)}
          </span>
        </div>

        <div class="order-row">
          <strong>Payment</strong>
          <span>
            ${escapeHtml(
              order.payment_method ||
              order.paymentMethod ||
              ""
            )}
          </span>
        </div>

        <div class="order-row">
          <strong>Payment Status</strong>
          <span>
            ${escapeHtml(
              order.payment_status ||
              order.paymentStatus ||
              ""
            )}
          </span>
        </div>

      </div>

    `;

  } catch (error) {

    result.innerHTML = `
      <div
        style="
          background:#fee2e2;
          color:#991b1b;
          padding:10px;
          border-radius:8px;">
        ${escapeHtml(
          error.message ||
          "Order not found."
        )}
      </div>
    `;

  }

}


/* =========================================================
   IMAGE ZOOM
========================================================= */

function zoomImage(src) {

  if (!src) return;

  document.getElementById(
    "zoomImage"
  ).src = src;

  document.getElementById(
    "imageZoomModal"
  ).style.display = "flex";

}


function closeZoom() {

  document.getElementById(
    "imageZoomModal"
  ).style.display = "none";

  document.getElementById(
    "zoomImage"
  ).src = "";

}


document.getElementById(
  "imageZoomModal"
).addEventListener(
  "click",
  function(event) {

    if (event.target === this) {
      closeZoom();
    }

  }
);


/* =========================================================
   START
========================================================= */

async function init() {
  showShop();
  await loadStore();
}

document.addEventListener("DOMContentLoaded", init);

</script>

</body>
</html>
